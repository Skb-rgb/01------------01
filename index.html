<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLO — Card Pack Experience</title>
<style>
:root{font-family:Inter,Arial,Helvetica,sans-serif;color:#1a1630;background:#eeeee7}*{box-sizing:border-box}body{margin:0;overflow:hidden}.scene{position:relative;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 48% 39%,#f9f9f3 0%,#eeeFE9 70%,#e7e7e0 100%);perspective:1100px}.hint{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:#85867e;white-space:nowrap}.stage{width:min(1000px,96vw);height:480px;position:relative;display:grid;place-items:center}.pack{position:absolute;width:180px;height:263px;z-index:5;cursor:pointer;filter:drop-shadow(9px 19px 15px #4444);transform-style:preserve-3d;animation:float 3.1s ease-in-out infinite;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s}.pack:focus-visible{outline:3px solid #611dff;outline-offset:12px}.pack-body{position:absolute;inset:0;background:linear-gradient(110deg,#fe5cae 0%,#ea2589 40%,#f535a9 80%,#d91578 100%);border-radius:4px;overflow:hidden;box-shadow:inset 5px 0 13px #fff7,inset -8px 0 14px #64044955;border:1px solid #e71c87}.pack-body:after{content:'';position:absolute;inset:0;background:linear-gradient(94deg,transparent 10%,#fff3 26%,transparent 37%,transparent 67%,#fff2 77%,transparent 88%);pointer-events:none}.seal{position:absolute;left:0;width:100%;height:11px;background:repeating-linear-gradient(90deg,#e52086 0 3px,#fa8fc8 3px 5px);z-index:2}.seal.top{top:0}.seal.bottom{bottom:0}.pack-header{position:absolute;top:26px;left:13px;right:13px;display:flex;justify-content:space-between;align-items:flex-start;color:white}.brand{font-size:30px;line-height:1;font-weight:900;letter-spacing:-2px}.tiny{font-size:6px;letter-spacing:.14em}.pack-footer{position:absolute;bottom:19px;left:12px;right:12px;display:flex;justify-content:space-between;color:#ffdeef;font-size:7px}.pack-star{position:absolute;left:28px;top:78px;width:124px;height:124px;filter:drop-shadow(0 6px 5px #80045999)}.pack-star svg{width:100%;height:100%}.tear{position:absolute;top:0;left:0;right:0;height:34px;background:linear-gradient(110deg,#ff71b8,#ee1887);clip-path:polygon(0 0,100% 0,100% 100%,90% 79%,78% 99%,65% 80%,54% 100%,41% 78%,29% 100%,18% 81%,0 100%);opacity:0;z-index:10}.cards{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;position:relative;z-index:3;pointer-events:none}.card{--turn:0deg;--rise:0px;position:relative;width:clamp(102px,15vw,146px);aspect-ratio:.70;flex:0 0 auto;border-radius:7px;padding:6px;background:linear-gradient(125deg,#fff8,#fff1 28%,#fff9 80%);box-shadow:0 15px 25px #5e5e5940,0 2px 4px #0002;opacity:0;transform:translateY(150px) scale(.27) rotate(var(--turn));transition:transform .8s cubic-bezier(.17,.88,.32,1.15),opacity .35s;transform-style:preserve-3d;cursor:pointer;pointer-events:none}.card-inner{height:100%;border-radius:4px;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}.card-art{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}.card-art:before{content:'';position:absolute;inset:-40%;background:repeating-conic-gradient(from 12deg at 50% 50%,#fff2 0deg 11deg,transparent 12deg 27deg);animation:spin 20s linear infinite}.creature{position:relative;font-size:clamp(58px,9vw,100px);filter:drop-shadow(3px 10px 5px #0003);transition:transform .4s;line-height:1}.card:hover .creature{transform:translateY(-7px) rotate(-8deg) scale(1.1)}.card-info{position:relative;z-index:1;background:linear-gradient(120deg,#ffffff9e,#fff6);padding:7px 8px 6px;min-height:42px}.card-name{font-weight:900;font-size:12px;letter-spacing:-.4px}.card-type{position:absolute;right:7px;top:9px;font-size:6px;font-weight:800;letter-spacing:.1em}.card-bottom{display:flex;justify-content:space-between;font-size:6px;margin-top:8px;text-transform:uppercase;letter-spacing:.04em}.card:after{content:'';pointer-events:none;position:absolute;inset:0;border-radius:7px;background:linear-gradient(110deg,transparent 20%,#fff8 48%,transparent 64%);transform:translateX(-160%);transition:transform .7s}.card:hover:after{transform:translateX(160%)}.card.selected{z-index:10;transform:translateY(-48px) scale(1.22) rotate(0deg)!important}.card.selected .creature{transform:scale(1.08)}.scene.revealed .pack{opacity:0;pointer-events:none;transform:translateY(-180px) scale(.35) rotate(26deg);animation:none}.scene.revealed .card{opacity:1;transform:translateY(var(--rise)) rotate(var(--turn));pointer-events:auto}.scene.revealed .card:nth-child(1){transition-delay:.08s}.scene.revealed .card:nth-child(2){transition-delay:.18s}.scene.revealed .card:nth-child(3){transition-delay:.28s}.scene.revealed .card:nth-child(4){transition-delay:.38s}.scene.revealed .card:nth-child(5){transition-delay:.48s}.scene.revealed .card.selected{transform:translateY(-48px) scale(1.22) rotate(0deg)!important;transition-delay:0s}.actions{position:absolute;bottom:clamp(30px,10vh,100px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;z-index:8}.btn{border:0;background:white;padding:11px 16px;border-radius:5px;color:#303033;box-shadow:0 3px 13px #00000012;font-size:12px;cursor:pointer;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0002}.caption{font-size:11px;color:#9a9c94;white-space:nowrap}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}.piece{position:absolute;width:var(--w);height:var(--h);left:50%;top:50%;background:var(--c);opacity:0;animation:burst 1.65s cubic-bezier(.14,.61,.31,1) forwards;animation-delay:var(--delay)}@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}55%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--rot))}}@keyframes float{0%,100%{transform:translateY(-3px) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){.stage{height:360px}.cards{gap:5px;padding:0 8px}.card{width:calc((100vw - 40px)/5);padding:3px;border-radius:4px}.card-info{padding:4px 3px;min-height:32px}.card-name{font-size:9px}.card-type,.card-bottom{font-size:4px}.card-bottom{margin-top:5px}.creature{font-size:clamp(34px,9vw,58px)}.pack{width:160px;height:234px}.pack-star{left:26px;top:70px;width:110px;height:110px}.hint{font-size:9px}.scene.revealed .card.selected{transform:translateY(-24px) scale(1.28) rotate(0deg)!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="scene" id="scene"><div class="hint">A tiny collectible universe ✦</div><div class="confetti" id="confetti" aria-hidden="true"></div><section class="stage" aria-label="Experiencia de cartas coleccionables"><div class="pack" id="pack" role="button" tabindex="0" aria-label="Abrir sobre de cartas"><div class="pack-body"><div class="seal top"></div><div class="pack-header"><span class="brand">holo</span><span class="tiny">SERIES 001</span></div><div class="pack-star"><svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bdfbff"/><stop offset=".22" stop-color="#7962e9"/><stop offset=".4" stop-color="#f9dcff"/><stop offset=".57" stop-color="#43e5b0"/><stop offset=".78" stop-color="#ffb6d1"/><stop offset="1" stop-color="#655fe7"/></linearGradient></defs><path d="M75 5 Q86 50 145 75 Q87 88 75 145 Q62 92 5 75 Q60 59 75 5Z" fill="url(#foil)" stroke="#fff8" stroke-width="4"/><ellipse cx="59" cy="75" rx="4" ry="6" fill="#3d294e"/><ellipse cx="89" cy="75" rx="4" ry="6" fill="#3d294e"/><path d="M66 91 Q75 102 84 91" fill="none" stroke="#3d294e" stroke-width="3" stroke-linecap="round"/></svg></div><div class="pack-footer"><span>Card pack</span><span>5 cards</span></div><div class="seal bottom"></div></div></div><div class="cards" id="cards" aria-label="Tus cartas"></div></section><div class="actions"><button class="btn" id="action">Open pack ✨</button><div class="caption" id="caption">Haz clic en el sobre para descubrir tus cartas</div></div></main>
<script>
const characters=[{name:'Blip',type:'SWEET',emoji:'🔴',bg:'linear-gradient(160deg,#ffe4df,#ffa98e)'},{name:'Ringo',type:'COSMIC',emoji:'🪐',bg:'linear-gradient(140deg,#172eae,#711baf 54%,#082651)'},{name:'Cubit',type:'LUCKY',emoji:'🟨',bg:'linear-gradient(130deg,#007c5e,#bafc75 62%,#dafa93)'},{name:'Facet',type:'DREAM',emoji:'💎',bg:'linear-gradient(150deg,#642bcd,#311b69 60%,#03514e)'},{name:'Nova',type:'STAR',emoji:'🌟',bg:'linear-gradient(140deg,#f82dc4,#fed338 80%)'}];
const scene=document.querySelector('#scene'),cards=document.querySelector('#cards'),pack=document.querySelector('#pack'),action=document.querySelector('#action'),caption=document.querySelector('#caption'),confetti=document.querySelector('#confetti');let opened=false;
function drawCards(){cards.innerHTML='';characters.forEach((c,i)=>{const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`Ver carta ${c.name}`);card.style.setProperty('--bg',c.bg);card.style.setProperty('--turn',`${(i-2)*2.2}deg`);card.style.setProperty('--rise',`${Math.abs(i-2)*7}px`);card.innerHTML=`<div class="card-inner"><div class="card-art"><span class="creature">${c.emoji}</span></div><div class="card-info"><div class="card-name">${c.name}</div><div class="card-type">${c.type}</div><div class="card-bottom"><span>✦ HOLO</span><span>NO. 00${i+1}</span></div></div></div>`;const select=()=>{if(!opened)return;document.querySelectorAll('.card').forEach(el=>{if(el!==card)el.classList.remove('selected')});card.classList.toggle('selected')};card.addEventListener('click',select);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});cards.append(card)})}
function burst(){confetti.replaceChildren();const colors=['#ff34ab','#ffc528','#5a61ff','#51d7ce','#f86953','#92ed49'];for(let i=0;i<115;i++){const p=document.createElement('i');p.className='piece';const a=Math.random()*Math.PI*2,r=80+Math.random()*550;p.style.setProperty('--x',`${Math.cos(a)*r}px`);p.style.setProperty('--y',`${Math.sin(a)*r*.7+160}px`);p.style.setProperty('--rot',`${Math.random()*1300-650}deg`);p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--w',`${3+Math.random()*8}px`);p.style.setProperty('--h',`${3+Math.random()*14}px`);p.style.setProperty('--delay',`${Math.random()*.22}s`);confetti.append(p)}setTimeout(()=>confetti.replaceChildren(),2300)}
function toggle(){if(!opened){opened=true;scene.classList.add('revealed');burst();action.textContent='Open another pack ↻';caption.textContent='Selecciona una carta para verla más de cerca'}else{opened=false;scene.classList.remove('revealed');action.textContent='Open pack ✨';caption.textContent='Haz clic en el sobre para descubrir tus cartas';document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));}}
action.addEventListener('click',toggle);pack.addEventListener('click',()=>{if(!opened)toggle()});pack.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!opened)toggle()}});drawCards();
</script>
</body></html>
